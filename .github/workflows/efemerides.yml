name: Efemerides Musicales Sebs News

on:
  schedule:
    # Se ejecuta todos los días a las 15:00 UTC (12:00 PM / Mediodía de Argentina)
    - cron: '0 15 * * *'
  workflow_dispatch: # Permite ejecutarlo a mano cuando quieras

jobs:
  run-efemerides:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          pip install requests google-genai

      - name: Ejecutar Efemérides
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python efemerides.py
