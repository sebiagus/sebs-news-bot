name: Radar de Lanzamientos Sebs News

on:
  schedule:
    # Se ejecuta los viernes a las 12:00 UTC (09:00 AM hora de Argentina)
    - cron: '0 12 * * 5'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

jobs:
  run-lanzamientos:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          pip install requests feedparser google-genai

      - name: Ejecutar Radar de Lanzamientos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python lanzamientos_viernes.py
